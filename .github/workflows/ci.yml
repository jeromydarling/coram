name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # §3.4 — a migration that adds PII without a retention rule fails here.
      # Deliberately the first check: it is the one that protects a promise we
      # have made publicly, and a run that dies at typecheck should still have
      # told us about a table with no retention position.
      - name: Retention rules
        run: npm run check:retention

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Anything that reaches a user's browser or the Worker runtime. Scoped to
      # production dependencies and set to fail on any severity, because that
      # set is small, we control every entry in it, and "moderate" in a package
      # we ship is not a thing to sit on.
      #
      # devDependencies are deliberately not gated here. Two advisories in the
      # local toolchain — esbuild's dev server via drizzle-kit, undici via
      # miniflare — have no version to move to; npm's only suggested fix for
      # each is a downgrade. Failing every build on them would train everyone to
      # ignore this step, which is the outcome the step exists to prevent. They
      # are reviewed when wrangler or drizzle-kit publishes, and the reasoning
      # is in the commit that accepted them.
      - name: Audit what we ship
        run: npm audit --omit=dev --audit-level=low

      # Not fatal. It prints the toolchain's advisories into the log so they
      # stay visible, and so the day one of them becomes fixable is a day
      # somebody sees it.
      - name: Audit the toolchain (advisory)
        run: npm audit --audit-level=moderate || true
