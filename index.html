<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coram</title>
    <!--
      The product shell is not indexed and not advertised. Marketing lives at
      the root path and is server-rendered; this document is only ever served
      under /app.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <!--
      §10: no external JS on any route. No fonts from Google, no CDN scripts,
      no chat widgets. If something needs to be loaded, it is self-hosted.
    -->
  </head>

    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
