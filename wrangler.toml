####################################################################
# Coram — one Worker. App + API + marketing site, same origin.
#
# Placeholder ids below are marked REPLACE_ME. Create the resources
# and paste the ids in; see docs/deploy.md for the exact commands.
####################################################################

name = "coram"
main = "src/worker/index.ts"
compatibility_date = "2026-07-01"

# postgres.js needs node:crypto / node:net / node:stream.
compatibility_flags = ["nodejs_compat"]

# The Vite build emits the SPA here. The Worker serves it at /app/*.
[assets]
directory = "./dist/client"
binding = "ASSETS"
# Static assets are matched BEFORE the Worker runs. An index.html at the assets
# root therefore claimed `/` and made the marketing home page unreachable in
# production, while every local render still worked because those go through
# the Worker. The build now relocates the shell to /app/index.html
# (scripts/relocate-spa-shell.mjs) so nothing shadows a Worker route, and this
# disables the implicit directory -> index.html mapping as a second guard.
html_handling = "none"

[observability]
enabled = true

####################################################################
# Workers AI — backs Scriba (§5.10).
#
# §5.10 asks for a private or self-hosted model. Workers AI is not
# self-hosted, but it adds no new processor: Cloudflare already holds
# the database connection, the objects, the sessions and the Worker
# itself. An external provider would widen the trust set by one; this
# widens it by nobody.
#
# INFERENCE_ENDPOINT still takes precedence when set, so a workspace
# that runs its own model keeps §5.10 exactly as written.
#
# Redaction is unaffected: assertRedacted runs over every message,
# including the system prompt, before either path opens a socket.
####################################################################

[ai]
binding = "AI"

####################################################################
# Database — Postgres behind Hyperdrive.
#
# The Worker connects as `coram_app`, a NOLOGIN-inheriting role that is
# NOT the table owner and does NOT have BYPASSRLS. That is deliberate:
# a table owner silently bypasses RLS unless FORCE ROW LEVEL SECURITY
# is set, and we do not want the security boundary resting on our
# remembering to set it. See migrations/0001_foundation.sql.
####################################################################

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "be0e244d4f1e4a60b5204ef98118bf03"

# Cron connects as coram_cron, which carries BYPASSRLS because the nightly
# sweep spans every tenant. It is a second Hyperdrive config pointing at the
# same database with a different user, so that request handlers hold no
# credential for it — §4.2 keeps service-role out of the request path.
[[hyperdrive]]
binding = "HYPERDRIVE_CRON"
id = "199707292fbf4a74ba1e89acb924a06c"

####################################################################
# Edge state
####################################################################

[[kv_namespaces]]
binding = "KV_SESSIONS"
id = "939afc76e5744522ace488444f24cf43"

[[kv_namespaces]]
binding = "KV_FLAGS"
id = "b76e775d058c4e57937145d8c8febd43"

[[kv_namespaces]]
binding = "KV_RATE"
id = "8eb70770b4824d82a9a9f1c268bae438"

####################################################################
# Object storage — zero egress
####################################################################

[[r2_buckets]]
binding = "R2_FILES"
bucket_name = "coram-files"

[[r2_buckets]]
binding = "R2_EXPORTS"
bucket_name = "coram-exports"

# Marketing photography (§8.2), generated at build time by
# `npm run imagery:generate` and uploaded by `npm run imagery:upload`.
# Deliberately a separate bucket from R2_FILES: this one serves bytes to
# unauthenticated visitors, and a bucket that does that should never also
# hold a workspace's uploads.
[[r2_buckets]]
binding = "R2_MEDIA"
bucket_name = "coram-media"

####################################################################
# Async jobs
#
# Q_IMPORT is unused: imports run inside the request because the rows
# are never stored between preview and commit (§5.1), so there is
# nothing for a queue to pick up.
####################################################################

[[queues.producers]]
binding = "Q_PURGE"
queue = "coram-purge"

[[queues.consumers]]
queue = "coram-purge"
max_batch_size = 100
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "coram-purge-dlq"

[[queues.producers]]
binding = "Q_SEND"
queue = "coram-send"

# Small batches and one retry. A send that fails twice should land in the
# dead-letter queue for a human, not be retried into a provider that is
# rate-limiting us — and never retried so often that someone receives the
# same message twice.
[[queues.consumers]]
queue = "coram-send"
max_batch_size = 25
max_batch_timeout = 10
max_retries = 1
dead_letter_queue = "coram-send-dlq"

####################################################################
# Scheduled
#   03:00 UTC daily — retention sweep across every registered table
#   04:00 UTC daily — canary staleness check (warn 100d, overdue 120d)
#   every six hours — watch-list poll: bills, hearings and agendas that moved.
#     Six hours rather than hourly because a council agenda is published days
#     before the meeting and a bill moves at most daily — polling faster would
#     knock on other people's servers for nothing.
####################################################################

[triggers]
crons = ["0 3 * * *", "0 4 * * *", "0 */6 * * *"]

####################################################################
# Non-secret vars. Secrets go in via `wrangler secret put`:
#   AUTH_JWT_SECRET          signing key for our own session JWTs
#   SUPPRESSION_PEPPER       peppers opt-out ledger hashes; never in Postgres
#   FEDERATION_STRIPE_SECRET routed through the CROS hub
#   STRIPE_WEBHOOK_SECRET
#   INFERENCE_KEY
####################################################################

[vars]
ENVIRONMENT = "development"
INFERENCE_ENDPOINT = "REPLACE_ME_private_inference_host"
CANARY_PUBKEY_FINGERPRINT = "REPLACE_ME_pgp_fingerprint"

# ENVIRONMENT is "development" here so that `vite dev` and `wrangler dev` serve
# a cookie without `Secure`, which is invisible over http on localhost.
#
# It is flipped at deploy time by `npm run deploy`, which passes
# `--var ENVIRONMENT:production`. There used to be an `[env.production]` block
# doing this and it did not work: the Vite Cloudflare plugin flattens this file
# into dist/coram/wrangler.json and drops every `env.*` section, so
# `wrangler deploy --env production` silently deployed the development vars.
# Live traffic ran for several deploys with an unSecure session cookie and
# internal error detail echoed to clients before /api/health gave it away.
# Do not reintroduce `[env.production]` — nothing reads it.

####################################################################
# Durable Objects
#   DO_DIAL    / DialerQueueDO  -> Nuntius     (§5.4)
#   DO_BALLOT  / BallotDO       -> Consilium   (§5.8)
#   DO_CHANNEL / ChannelDO      -> Colloquium  (§5.7)
#
# ChannelDO's storage holds the only copy of a message's ciphertext, for
# the channel's TTL and no longer (§3.2). Nothing else in this Worker
# stores message content, and Postgres holds envelopes only.
####################################################################

[[durable_objects.bindings]]
name = "DO_CHANNEL"
class_name = "ChannelDO"

[[durable_objects.bindings]]
name = "DO_BALLOT"
class_name = "BallotDO"

[[durable_objects.bindings]]
name = "DO_DIAL"
class_name = "DialerQueueDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DialerQueueDO", "BallotDO", "ChannelDO"]
